name: Python Build Package

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v0.5.7). Uses workflow from main; checks out this tag."
        required: true
        type: string

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
        include:
          - os: ubuntu-22.04
            docker_platform: linux/amd64
            use_docker: true
          - os: ubuntu-22.04-arm
            docker_platform: linux/arm64
            use_docker: true
          - os: macos-15
            use_docker: false
          - os: macos-15-intel
            use_docker: false
          # New in 0.7.0 and not yet proven on a release: a Windows build that
          # fails must not stop the other wheels from being published. Remove
          # `experimental` once a release has shipped Windows wheels.
          - os: windows-2025
            use_docker: false
            experimental: true
          - os: windows-11-arm
            use_docker: false
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        # The steps are written for bash; Windows runners have it too.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Verify release tag is on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "workflow_dispatch tag must match ^v[0-9]+\\.[0-9]+\\.[0-9]+$, got: $TAG"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          git fetch origin main --no-tags
          TAGSHA="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAGSHA" origin/main; then
            echo "tag commit $TAGSHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "Verified $TAG ($TAGSHA) is on origin/main"
      - name: Set package version from tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "Publishing caddysnake ${VERSION} from ${TAG}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" cmd/cli/pyproject.toml
          rm -f cmd/cli/pyproject.toml.bak
          grep '^version' cmd/cli/pyproject.toml
      - name: Set up Docker Buildx
        if: matrix.use_docker
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226
      - name: Build Caddy with caddy-snake module (Docker)
        if: matrix.use_docker
        env:
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          docker build -f builder.Dockerfile --platform "$DOCKER_PLATFORM" --build-arg PY_VERSION="$PY_VERSION" -t caddy-snake-builder .
          docker run --rm -v "$(pwd)":/output caddy-snake-builder
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !matrix.use_docker }}
        with:
          go-version: "1.26.10"
          cache: false
      - name: Build Caddy with caddy-snake module (native)
        if: ${{ !matrix.use_docker }}
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
          CGO_ENABLED=0 xcaddy build --with github.com/mliezun/caddy-snake=. --with github.com/mliezun/caddy-snake/apps
      - name: Install Rust
        if: ${{ !matrix.use_docker }}
        run: rustup toolchain install stable
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the CLI
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # A program needs the .exe ending there, and the Python that
            # setup-python selected is called plain "python".
            mv caddy.exe cmd/cli/caddysnake-cli.exe
            PY=python
          else
            mv caddy cmd/cli/caddysnake-cli
            PY="python${PY_VERSION}"
          fi
          cd cmd/cli/
          "$PY" -m pip install maturin
          "$PY" -m maturin build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddysnake-cli-${{ matrix.python-version }}-${{ matrix.os }}
          path: cmd/cli/target/wheels/*.whl

  publish:
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    # The pypa/gh-action-pypi-publish action ships only a linux/amd64 image,
    # so the publish job must run on an amd64 runner regardless of where the
    # wheels were built.
    runs-on: ubuntu-24.04
    environment:
      name: pypi-publish
      url: https://pypi.org/p/caddysnake
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: caddysnake-cli-*
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          packages-dir: dist
