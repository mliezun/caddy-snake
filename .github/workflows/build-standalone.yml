name: Caddy Standalone

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

env:
  # If the Go module proxy fails mid-download, fetch from the source instead
  # ("|" falls back on any error, "," only on "not found").
  GOPROXY: "https://proxy.golang.org|direct"

# A new push to a pull request cancels the runs of the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  # The Caddy server inside a standalone binary is the same whatever Python is
  # bundled with it, so it is compiled once per target, on Linux (pure Go, CGO
  # off: it cross-compiles for every system), and handed to the jobs below.
  server:
    needs: changes
    if: needs.changes.outputs.embed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, goos: linux, goarch: amd64}
          - {target: linux-arm64, goos: linux, goarch: arm64}
          - {target: linux-riscv64, goos: linux, goarch: riscv64}
          - {target: darwin-arm64, goos: darwin, goarch: arm64}
          - {target: darwin-amd64, goos: darwin, goarch: amd64}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      # Installed for this machine; only the Caddy build below is cross-compiled.
      - name: Install Xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
      - name: Build the server
        working-directory: cmd/embed
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 xcaddy build --output caddy --with github.com/mliezun/caddy-snake=../..
      - name: Hand the server to the bundling jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embed-server-${{ matrix.target }}
          path: cmd/embed/caddy
          retention-days: 1

  # Bundles the server with one Python build into the standalone binary. Also
  # pure Go and cross-compiled, so it runs on Linux for every target.
  build:
    permissions:
      contents: write
    needs: [changes, server]
    if: needs.changes.outputs.embed == 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # Two Pythons for pull requests, all of them for main and releases.
        python-version: ${{ fromJSON(needs.changes.outputs.build_pythons) }}
        target: [linux-amd64, linux-arm64, linux-riscv64, darwin-arm64, darwin-amd64]
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            pybs-arch: x86_64_v2-unknown-linux-gnu
          - target: linux-arm64
            goos: linux
            goarch: arm64
            pybs-arch: aarch64-unknown-linux-gnu
          # python-build-standalone has no PGO builds for riscv64, so the
          # free-threaded variant uses lto only.
          - target: linux-riscv64
            goos: linux
            goarch: riscv64
            pybs-arch: riscv64-unknown-linux-gnu
            nogil-build-config: freethreaded+lto
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            pybs-arch: aarch64-apple-darwin
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            pybs-arch: x86_64-apple-darwin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose architecture
        id: choose-arch
        env:
          PYBS_ARCH: ${{ matrix.pybs-arch }}
        run: echo "PYBS_ARCH=${PYBS_ARCH}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false
      - name: Fetch the server built for this target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embed-server-${{ matrix.target }}
          path: cmd/embed
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Retrieve python build standalone
        if: ${{ !endsWith(matrix.python-version, '-nogil') }}
        working-directory: cmd/embed
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: | # zizmor: ignore[template-injection]
          python3 pybs.py latest --python-version ${{ matrix.python-version }} --architecture ${{ steps.choose-arch.outputs.PYBS_ARCH }} --build-config pgo+lto --content-type install_only_stripped
          mv cpython-*.tar.gz python-standalone.tar.gz
          go build -o caddy-standalone main.go
          mv caddy-standalone caddy
      - name: Retrieve python build standalone (nogil)
        if: ${{ endsWith(matrix.python-version, '-nogil') }}
        working-directory: cmd/embed
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          NOGIL_BUILD_CONFIG: ${{ matrix.nogil-build-config || 'freethreaded+pgo+lto' }}
        run: | # zizmor: ignore[template-injection]
          PY_VERSION_BASE="${{ matrix.python-version }}"
          PY_VERSION_BASE="${PY_VERSION_BASE%-nogil}"
          python3 pybs.py latest --python-version "${PY_VERSION_BASE}" --architecture ${{ steps.choose-arch.outputs.PYBS_ARCH }} --build-config "${NOGIL_BUILD_CONFIG}" --content-type full
          tar -xf cpython-*.tar.zst
          mv python/install .
          rm -rf python
          mv install python
          tar -czf python-standalone.tar.gz python
          go build -o caddy-standalone main.go
          mv caddy-standalone caddy
      # The one target this runner can run. The machine's own Python is a
      # different version from the bundled one, so this fails if the binary
      # does not use the Python it carries.
      - name: Smoke test the standalone binary
        if: matrix.target == 'linux-amd64'
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          printf 'import sys\n\ndef app(environ, start_response):\n    start_response("200 OK", [("Content-Type", "text/plain")])\n    return [("python %%d.%%d" %% sys.version_info[:2]).encode()]\n' > main.py
          chmod +x "$GITHUB_WORKSPACE/cmd/embed/caddy"
          # Only the system folders on PATH, so the Python set up for this job is out of reach.
          env PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/cmd/embed/caddy" python-server --server-type wsgi --app main:app --listen 127.0.0.1:9077 > run.log 2>&1 &
          for _ in $(seq 1 60); do
            got="$(curl -s -m 3 http://127.0.0.1:9077/ || true)"
            if [ -n "$got" ]; then break; fi
            sleep 1
          done
          echo "the app answered: $got (bundled: $PY_VERSION, this machine: $(/usr/bin/python3 --version 2>&1))"
          case "$got" in
            "python ${PY_VERSION%-nogil}") ;;
            *) tail -20 run.log; exit 1 ;;
          esac
        env:
          PY_VERSION: ${{ matrix.python-version }}
      - name: Upload caddy standalone
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-standalone-${{ matrix.python-version }}-${{ steps.choose-arch.outputs.PYBS_ARCH }}
          path: |
            cmd/embed/caddy
      - name: Package caddy standalone
        if: github.event_name == 'release'
        run: | # zizmor: ignore[template-injection]
          tar -czf caddy-standalone-${{ matrix.python-version }}-${{ steps.choose-arch.outputs.PYBS_ARCH }}.tar.gz cmd/embed/caddy
      - name: Upload to release
        if: github.event_name == 'release'
        run: | # zizmor: ignore[template-injection]
          gh release upload ${{ github.event.release.tag_name }} caddy-standalone-${{ matrix.python-version }}-${{ steps.choose-arch.outputs.PYBS_ARCH }}.tar.gz --repo ${{ github.repository }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
