name: Integration Tests Windows

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tool-name: ["simple_async"]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install Xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        working-directory: tests/${{ matrix.tool-name }}/
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh
      - name: Build caddy
        working-directory: tests/${{ matrix.tool-name }}/
        run: |
          $env:CGO_ENABLED = "0"
          xcaddy build --with github.com/mliezun/caddy-snake=../..
        shell: pwsh
      - name: Run integration tests
        working-directory: tests/${{ matrix.tool-name }}/
        run: |
          touch caddy.log
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", ".\caddy.exe run --config Caddyfile > caddy.log 2>&1"
          $timeout = 60
          while ($timeout -gt 0 -and -not (Select-String "finished cleaning storage units" -Path "caddy.log")) {
            Start-Sleep -Seconds 1
            $timeout -= 1
          }
          .\venv\Scripts\activate
          python main_test.py
        shell: pwsh
      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-logs-${{ matrix.tool-name }}-${{ matrix.python-version }}
          path: |
            tests/${{ matrix.tool-name }}/caddy.log
