name: Integration Tests Linux

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

# A new push to a pull request cancels the runs of the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
      - name: Install Xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
      - name: Build the server
        run: CGO_ENABLED=0 xcaddy build --with github.com/mliezun/caddy-snake=.
      - name: Upload caddy binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-linux-${{ matrix.os }}
          path: caddy

  tests:
    needs: [changes, build]
    if: needs.changes.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        tool-name:
          - "django"
          - "django_channels"
          - "flask"
          - "fastapi"
          - "simple_autoreload"
          - "simple_async"
          - "simple_cache"
          - "simple_start_timeout"
          - "simple_isolation"
          - "simple_request_body"
          - "simple_mount_prefix"
          - "socketio"
          - "dynamic"
        # Two Pythons on one kind of machine for pull requests, all of them on main.
        python-version: ${{ fromJSON(needs.changes.outputs.pythons) }}
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
        exclude:
          # Not exercised on CPython free-threaded (nogil) builds
          - tool-name: simple_cache
            python-version: "3.13t"
          - tool-name: simple_start_timeout
            python-version: "3.13t"
          - tool-name: simple_cache
            python-version: "3.14t"
          - tool-name: simple_start_timeout
            python-version: "3.14t"
          - tool-name: simple_cache
            python-version: "3.15t"
          - tool-name: simple_start_timeout
            python-version: "3.15t"
          - tool-name: simple_isolation
            python-version: "3.13t"
          - tool-name: simple_isolation
            python-version: "3.14"
          - tool-name: simple_isolation
            python-version: "3.14t"
          - tool-name: simple_isolation
            python-version: "3.15"
          - tool-name: simple_isolation
            python-version: "3.15t"
          - tool-name: simple_isolation
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust (simple_cache)
        if: matrix.tool-name == 'simple_cache'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rustc cargo
      - name: Set up venv and install dependencies
        working-directory: tests/${{ matrix.tool-name }}/
        run: |
          rm -rf venv
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Install local caddysnake package (simple_cache)
        if: matrix.tool-name == 'simple_cache'
        working-directory: tests/${{ matrix.tool-name }}/
        run: |
          source venv/bin/activate
          pip install maturin
          pip install "${GITHUB_WORKSPACE}/cmd/cli"
      - name: Download caddy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: caddy-linux-${{ matrix.os }}
          path: tests/${{ matrix.tool-name }}/
      - name: Run integration tests
        working-directory: tests/${{ matrix.tool-name }}/
        if: ${{ !endsWith(matrix.python-version, 't') && matrix.tool-name != 'simple_isolation' }}
        run: |
          chmod +x caddy
          source venv/bin/activate
          if [ "${{ matrix.tool-name }}" = "simple_start_timeout" ]; then
            python main_test.py
          else
            ./caddy run --config Caddyfile > caddy.log 2>&1 &
            timeout 60 bash -c 'while ! grep -q "finished cleaning storage units" caddy.log; do sleep 1; done'
            python main_test.py
          fi
      - name: Run simple_isolation (host Docker)
        if: matrix.tool-name == 'simple_isolation' && matrix.python-version == '3.13' && matrix.os == 'ubuntu-22.04'
        working-directory: tests/simple_isolation/
        run: |
          chmod +x caddy
          docker pull python:3.13-slim
          export TMPDIR="${GITHUB_WORKSPACE}/.tmp/caddysnake-integration"
          mkdir -p "$TMPDIR"
          export CADDYSNAKE_ISOLATION_PROBE_SECRET=host-only-secret
          source venv/bin/activate
          ./caddy run --config Caddyfile > caddy.log 2>&1 &
          CADDY_PID=$!
          if ! timeout 300 bash -c 'while ! grep -q "finished cleaning storage units" caddy.log; do sleep 1; done'; then
            echo ">>> Caddy failed to become ready"
            tail -300 caddy.log
            exit 1
          fi
          python -m pytest main_test.py -v -k "not leftover"
          kill "$CADDY_PID" 2>/dev/null || true
          wait "$CADDY_PID" 2>/dev/null || true
          sleep 2
          python -m pytest main_test.py -v -k "leftover"
      - name: Run integration tests (nogil)
        working-directory: tests/${{ matrix.tool-name }}/
        if: ${{ endsWith(matrix.python-version, 't') && matrix.tool-name != 'flask' && matrix.tool-name != 'simple_cache' && matrix.tool-name != 'simple_start_timeout' && matrix.tool-name != 'simple_isolation' }}
        continue-on-error: true
        run: |
          ./caddy run --config Caddyfile > caddy.log 2>&1 &
          source venv/bin/activate
          python main_test.py
      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-integration-tests-logs-${{ matrix.tool-name }}-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            tests/${{ matrix.tool-name }}/caddy.log
            tests/${{ matrix.tool-name }}/**/*.log
