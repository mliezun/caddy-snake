# PR Docker image build only (no push). Kept separate from docker-publish.yml so we never
# use jobs.environment here — GitHub treats environment as a deployment (noisy PR UI, one
# row per matrix cell when combined with publish jobs on the same workflow file).
name: Docker

on:
  pull_request:
    branches: ["main"]

permissions: {}

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER_HUB: docker.io
  IMAGE_NAME: ${{ github.repository }}

# A new push to a pull request cancels the runs of the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Required before uses: ./.github/actions/... — the runner must have the repo (and action.yml) on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-build-push
        with:
          python-version: ${{ matrix.python-version }}
          push-image: "false"
          platforms: linux/amd64

  riscv64:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    name: Build and smoke-test riscv64 image (QEMU)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226
      - name: Build riscv64 image
        run: docker buildx build --platform linux/riscv64 --build-arg PY_VERSION=3.13 -t caddy-snake:riscv64 --load .
      - name: Smoke test under emulation
        run: |
          docker run --rm --platform linux/riscv64 caddy-snake:riscv64 caddy version
          for bin in python python3; do
            got=$(docker run --rm --platform linux/riscv64 --entrypoint "$bin" caddy-snake:riscv64 -c 'import platform, sys; print(platform.machine(), f"{sys.version_info.major}.{sys.version_info.minor}")')
            echo "$bin -> $got"
            test "$got" = "riscv64 3.13"
          done

  python-symlink:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    name: Verify python/python3 symlink
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image and verify interpreters
        run: |
          expected="${{ matrix.python-version }}"
          docker build --build-arg PY_VERSION="$expected" -t caddy-snake:pycheck .
          for bin in python python3; do
            got=$(docker run --rm --entrypoint "$bin" caddy-snake:pycheck -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            echo "$bin -> $got (expected $expected)"
            test "$got" = "$expected"
          done

  trivy:
    name: Trivy scan
    runs-on: ubuntu-24.04
    needs: [changes, build]
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image for scanning
        run: |
          docker build --build-arg PY_VERSION=${{ matrix.python-version }} -t caddy-snake:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy-snake:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
