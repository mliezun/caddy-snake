# Tag releases only. Uses docker-publish environment for registry secrets / protection rules.
name: Docker publish

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER_HUB: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: docker-publish
    steps:
      # Required before uses: ./.github/actions/... — the runner must have the repo (and action.yml) on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag is on main
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch origin main --no-tags
          TAGSHA="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAGSHA" origin/main; then
            echo "tag commit $TAGSHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "Verified $TAG ($TAGSHA) is on origin/main"
      - uses: ./.github/actions/docker-build-push
        with:
          python-version: ${{ matrix.python-version }}
          push-image: "true"
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
