[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "caddysnake"
version = "0.8.0"
description = "Python WSGI/ASGI server powered by Caddy"
authors = [
    {name = "Miguel Liezun", email = "liezun.js@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Go",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "click>=8.3.0",
    # `caddysnake apps` builds each app's environment with uv.
    "uv>=0.5",
]

[project.urls]
Homepage = "https://caddy-snake.readthedocs.io"
Repository = "https://github.com/mliezun/caddy-snake.git"

[tool.maturin]
python-source = "."
module-name = "caddysnake"
include = [
    "caddysnake-cli",
    "caddysnake-cli.exe",
    "caddysnake_cli.py",
    "caddysnake/kv_cache.py",
    "caddysnake/__init__.py"
]

[project.scripts]
caddysnake = "caddysnake_cli:cli"
